<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Noklingo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noklingo" />
    <meta name="description" content="Learn Thai through real conversations." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./noklingo-icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./noklingo-apple-touch-icon.png" sizes="180x180" />
    <title>Noklingo</title>
    <script>
      (() => {
        const welcomeSeenKey = "noklingo:welcome-seen:v1";
        let destination = "./welcome/";
        try {
          if (window.localStorage.getItem(welcomeSeenKey)) destination = "./today/";
        } catch {
          // A private browsing policy may deny storage; Welcome remains safe.
        }
        window.location.replace(new URL(destination, window.location.href).href);
      })();
    </script>
  </head>
  <body>
    <p>Opening NokLingo…</p>
    <noscript><p><a href="./welcome/">Open NokLingo</a></p></noscript>
  </body>
</html>
